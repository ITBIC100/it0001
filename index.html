<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cek QR Product Search</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',Tahoma,Verdana,sans-serif;
}
body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;

    background:linear-gradient(
        135deg,
        #ffffff,
        #fafafa,
        #f4f4f4
    );
    padding:12px;
    overflow-x:hidden;
    position:relative;
}
/* Background */
body::before{
    content:"";
    position:absolute;
    width:280px;
    height:280px;
    border-radius:50%;
    background:#ffc9df;
    top:-100px;
    left:-100px;
    filter:blur(70px);
    opacity:.5;
}
body::after{
    content:"";
    position:absolute;
    width:280px;
    height:280px;
    border-radius:50%;
    background:#c7e3ff;
    bottom:-100px;
    right:-100px;
    filter:blur(70px);
    opacity:.5;
}
/* Container */
.container{
    width:100%;
    max-width:900px;
    position:relative;
    z-index:10;
    background:rgba(255,255,255,.90);
    backdrop-filter:blur(15px);
    border-radius:20px;
    border:1px solid #ececec;
    padding:15px;
    box-shadow:
    0 4px 15px rgba(0,0,0,.05);
}

/* Judul */

h1{
    text-align:center;
    font-size:26px;
    font-weight:700;
    color:#222;
    margin-bottom:15px;
}
/* Search */
.search-box{
    display:grid;
    grid-template-columns: 1fr 70px 70px;
    gap:6px;
    align-items:center;
}
.search-box input{
    width:100%;
    height:42px;
    border-radius:22px;
    border:1px solid #dcdcdc;
    background:#fff;
    padding:0 15px;
    font-size:14px;
    color:#111;
    outline:none;
    transition:.2s;
}

.search-box input::placeholder{
    color:#9a9a9a;
}

.search-box input:focus{

    border-color:#4f93ff;

    box-shadow:
    0 0 0 3px rgba(79,147,255,.15);
}

/* Tombol */

button{

    height:42px;
    border:none;
    border-radius:12px;
    cursor:pointer;
    font-size:12px;
    font-weight:700;
    transition:.2s;
}

button:nth-child(2){

    background:#ffffff;

    color:#222;

    border:1px solid #dddddd;
}

button:nth-child(3){

    background:#f70f51;

    color:white;
}

/* Result */

.result{

    margin-top:10px;

    background:white;

    border:1px solid #eeeeee;

    border-radius:12px;

    padding:10px;

    box-shadow:
    0 2px 6px rgba(0,0,0,.03);
}

/* QR Header */

.result h2{

    font-size:10px;

    font-weight:700;

    color:#444;

    line-height:1.4;

    word-break:break-all;

    margin-bottom:8px;
}

/* Valid */

.valid{

    background:#fcfffc;

    border:1px solid #ddeedd;

    border-radius:10px;

    padding:8px;
}

/* Invalid */

.invalid{

    background:#fff7f7;

    border:1px solid #ffd4d4;

    border-radius:10px;

    padding:10px;

    color:#c40000;

    font-size:12px;

    font-weight:700;

    line-height:1.5;
}

/* Table */

table{

    width:100%;

    border-collapse:collapse;
}

tr{

    border-bottom:1px solid #f1f1f1;
}

tr:last-child{
    border-bottom:none;
}

td{

    padding:6px 4px;

    font-size:12px;

    line-height:1.4;

    color:#111;

    font-weight:600;
}

/* Label */

td:first-child{

    width:95px;

    color:#5138f7;

    font-weight:800;

    font-size:10px;

    text-transform:uppercase;

    letter-spacing:.4px;
}

/* Value */

td:last-child{

    color:#000;

    font-weight:700;
}

/* Mobile */

@media(max-width:768px){

    body{
        padding:8px;
    }

    .container{

        padding:12px;

        border-radius:15px;
    }

    h1{

        font-size:18px;

        margin-bottom:10px;
    }

    .search-box{

        display:grid;

        grid-template-columns:
        calc(100% - 150px)
        70px
        70px;

        gap:5px;
    }

    .search-box input{

        width:100%;

        height:40px;

        font-size:14px;
    }

    button{

        width:70px;

        height:40px;

        font-size:11px;
    }

    .result{

        padding:8px;

        border-radius:10px;
    }

    .result h2{

        font-size:9px;
    }

    td{

        font-size:11px;

        padding:4px 2px;

        color:#57a5f8;

        font-weight:700;
    }

    td:first-child{

        width:80px;

        font-size:9px;

        color:#5138f7;

        font-weight:800;
    }

    td:last-child{

        color:#111;

        font-weight:700;
    }
}

</style>

/* ===========================
   MASTER UOM BERDASARKAN PT
=========================== */

const uomMaster = {
    "1": uom1,
    "2": uom2
};

function getUomName(batch, uomCode){

    const pt = batch.charAt(0);

    return uomMaster[pt]?.[uomCode] || "-";

}


/* ===========================
   BATCH LOOKUP
=========================== */

const bulan = {
A:1,
B:2,
C:3,
D:4,
E:5,
F:6,
G:7,
H:8,
I:9,
J:10,
K:11,
L:12
};

const kodeDigit = {
S:"1",
U:"2",
M:"3",
B:"4",
E:"5",
R:"6",
T:"7",
A:"8",
L:"9",
I:"0"
};

const ptMaster = {
"1":"BAI",
"2":"IMI"
};


/* ===========================
   DECODE BATCH
=========================== */

function decodeBatch(batch){

    if(batch.length < 8){
        return {
            valid:false,
            tanggal:"Batch tidak valid"
        };
    }

    let pt = batch.substring(0,1);

    let blnCode = batch.substring(1,2);

    let d1 = batch.substring(2,3);
    let d2 = batch.substring(3,4);

    let y1 = batch.substring(4,5);
    let y2 = batch.substring(5,6);
    let y3 = batch.substring(6,7);

    let bulanAngka = bulan[blnCode];

    if(
       !bulanAngka ||
       !kodeDigit[d1] ||
       !kodeDigit[d2] ||
       !kodeDigit[y1] ||
       !kodeDigit[y2] ||
       !kodeDigit[y3]
    ){
        return {
            valid:false,
            pt:ptMaster[pt] || "-",
            tanggal:"Batch Tidak Valid"
        };
    }

    let hari =
        kodeDigit[d1] +
        kodeDigit[d2];

    let tahun =
        "20" +
        kodeDigit[y1] +
        kodeDigit[y2];

    const namaBulan = [
        "",
        "Januari",
        "Februari",
        "Maret",
        "April",
        "Mei",
        "Juni",
        "Juli",
        "Agustus",
        "September",
        "Oktober",
        "November",
        "Desember"
    ];

    return{
        valid:true,
        pt:ptMaster[pt] || "-",
        tanggal:
        hari+
        " "+
        namaBulan[bulanAngka]+
        " "+
        tahun
    };
}


/* ===========================
   SEARCH
=========================== */

function cari(){

    let qr =
    document.getElementById("scan")
    .value.trim();
    
    if(qr === ""){
        document.getElementById("hasil").innerHTML = "";
        return;
    }

    let p = qr.split("/");

    if(p.length < 5){
        alert("Format scan tidak valid");
        return;
    }

    let barcode = p[0];
    let qty = p[1];
    let uomCode = p[3];
    let batch = p[4];

    
    // PT diambil dari digit pertama batch
    let ptBatch = batch.charAt(0);

    // Cari berdasarkan Barcode + PT Batch
    let item = items.find(row =>
        row.barcode === barcode &&
        row.pt === ptBatch
    );


    if(!item){
        document.getElementById("hasil").innerHTML=
        `
        <div class="invalid">
            Item tidak ditemukan
            <br><br>
            Barcode : ${barcode}
            <br>
            PT Batch : ${ptBatch}
            <br><br>
            Cek apakah Barcode sesuai dengan PT pada digit pertama Batch.
        </div>
        `;
        return;
    }

    let dataBatch =
    decodeBatch(batch);

    let warna =
    dataBatch.valid ? "valid" : "invalid";

    document.getElementById("hasil").innerHTML=`

    <div class="result">

        <h2>
        ${qr}
        </h2>

        <div class="${warna}">

            <table>

                <tr>
                    <td width="180"><b>Item No</b></td>
                    <td>${item.itemNo}</td>
                </tr>

                <tr>
                    <td><b>Item Description</b></td>
                    <td>${item.description}</td>
                </tr>

                <tr>
                    <td><b>Qty</b></td>
                    <td>${qty}</td>
                </tr>

                <tr>
                    <td><b>UoM</b></td>
                    <td>${getUomName(batch, uomCode)}</td>
                </tr>

                <tr>
                    <td><b>Batch</b></td>
                    <td>${batch}</td>
                </tr>

                <tr>
                    <td><b>PT</b></td>
                    <td>${dataBatch.pt}</td>
                </tr>

                <tr>
                    <td><b>Tanggal Produksi</b></td>
                    <td>${dataBatch.tanggal}</td>
                </tr>

                <tr>
                    <td><b>Status Batch</b></td>
                    <td>
                    ${
                        dataBatch.valid
                        ? '✅ VALID'
                        : '❌ INVALID'
                    }
                    </td>
                </tr>

            </table>

        </div>

    </div>`;

}

document.getElementById("scan")
.addEventListener("keydown", function(e){

    if(e.key === "Enter"){
        cari();
    }
});

cari();

function clearScan(){
    document.getElementById("scan").value = "";
    document.getElementById("hasil").innerHTML = "";
    document.getElementById("scan").focus();
}
